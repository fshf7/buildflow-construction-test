name: Deploy staging

# После зелёного CI на main: сначала миграции в Supabase staging, затем код в Vercel.
# Порядок важен: код рассчитывает на новую схему; миграции пишутся обратно совместимыми
# (expand/contract), поэтому предыдущая версия кода продолжает работать после миграции.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false # миграции не прерываем

permissions:
  contents: read

jobs:
  migrate:
    name: Миграции → Supabase staging
    # Включается переменной репозитория STAGING_ENABLED=true, когда заданы секреты окружения staging.
    if: >-
      vars.STAGING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          # Ровно тот коммит, на котором прошёл CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Защита от путаницы окружений: строка подключения должна вести в проект SUPABASE_PROJECT_REF
      # (в pooler-URL пользователь — postgres.<ref>). Значения не печатаются.
      - name: Сверка БД с окружением
        run: |
          test -n "$REF" || { echo "::error::Не задана переменная SUPABASE_PROJECT_REF окружения"; exit 1; }
          case "$STAGING_DB_URL" in *"$REF"*) ;; *) echo "::error::STAGING_DB_URL не от проекта SUPABASE_PROJECT_REF"; exit 1;; esac
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      # Пароль БД может содержать @ # / ? — кодируем его; значение маскируется в логах.
      - name: Строка подключения
        run: python3 scripts/ci/normalize-db-url.py
        env:
          RAW_DB_URL: ${{ secrets.STAGING_DB_URL }}
      # STAGING_DB_URL — строка подключения через Session pooler (IPv4; прямой хост БД — только IPv6).
      # seed.sql и scripts/seed-local.mts в staging не применяются (db push их не выполняет).
      - name: Список неприменённых миграций
        run: supabase migration list --db-url "$DB_URL"
      - name: supabase db push
        run: supabase db push --db-url "$DB_URL" --yes

  deploy:
    name: Код → Vercel (staging)
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Переменные окружения (NEXT_PUBLIC_*, SUPABASE_SECRET_KEY) хранятся в Vercel и
      # подтягиваются при сборке: NEXT_PUBLIC_* вшиваются в бандл на этапе build.
      - run: npx --yes vercel@63.1.2 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      # Проект Vercel должен быть настроен именно на это окружение (иначе — стоп до сборки).
      - name: Сверка переменных Vercel с окружением
        run: |
          f=.vercel/.env.production.local
          grep -qx "NEXT_PUBLIC_APP_ENV=\"\?$APP_ENV\"\?" "$f" || { echo "::error::NEXT_PUBLIC_APP_ENV в Vercel ≠ $APP_ENV"; exit 1; }
          grep -qx "NEXT_PUBLIC_SUPABASE_URL=\"\?$SUPABASE_URL\"\?" "$f" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL в Vercel ≠ переменной окружения"; exit 1; }
        env:
          APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      - run: npx --yes vercel@63.1.2 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@63.1.2 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
