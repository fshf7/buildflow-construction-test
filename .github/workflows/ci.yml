name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, unit-тесты, сборка
    runs-on: ubuntu-latest
    env:
      # Несекретные значения для сборки: публичные env валидируются при `next build`.
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  db:
    name: Миграции на чистой БД + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      # Только Postgres — быстрее полного стека.
      - run: supabase db start
      - name: supabase db reset (все миграции + seed с нуля)
        run: supabase db reset
      - name: pgTAP
        run: supabase test db
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # gen types запускает контейнер postgres-meta; анонимные pull из ECR Public на раннерах
      # упираются в лимит (toomanyrequests). Тянем заранее с повторами, иначе — копию с Docker Hub.
      # Версия образа привязана к версии CLI выше (2.108.0 → postgres-meta v0.96.1).
      - name: Образ postgres-meta
        run: |
          IMG=public.ecr.aws/supabase/postgres-meta:v0.96.1
          for i in 1 2 3; do docker pull "$IMG" && exit 0; sleep $((i * 15)); done
          docker pull supabase/postgres-meta:v0.96.1
          docker tag supabase/postgres-meta:v0.96.1 "$IMG"
      - name: Типы БД соответствуют миграциям
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts \
            || (echo "::error::Типы устарели — выполните npm run db:types и закоммитьте" && exit 1)

  e2e:
    name: E2E (Playwright) на чистой БД
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Чистая БД: миграции + seed.sql. Лишние сервисы не поднимаем (быстрее и меньше образов).
      # Образы с ECR Public иногда упираются в лимит — повторяем, последняя попытка через Docker Hub.
      - name: Supabase (БД, Auth, REST, Mailpit)
        run: |
          EXCLUDE=realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
          for i in 1 2 3; do
            if [ "$i" = 3 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io; fi
            supabase start -x "$EXCLUDE" && exit 0
            supabase stop --no-backup || true
            sleep $((i * 20))
          done
          exit 1

      - name: .env.local из локального Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_APP_ENV=local"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local

      - name: Браузер Playwright
        run: npx playwright install --with-deps chromium

      # Локальные пользователи и организация — в global-setup (seed-local.mts --reset-mfa).
      - name: E2E
        run: npm run test:e2e

      - name: Отчёт и артефакты падений
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
