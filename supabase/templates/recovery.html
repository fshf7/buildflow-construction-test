<h2>Восстановление пароля BuildFlow</h2>
<p>Кто-то (возможно, вы) запросил смену пароля для этой учётной записи.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
  >
    Задать новый пароль
  </a>
</p>
<p>
  Ссылка одноразовая и действует ограниченное время. Если вы не запрашивали смену пароля — просто
  проигнорируйте письмо: пароль останется прежним.
</p>
